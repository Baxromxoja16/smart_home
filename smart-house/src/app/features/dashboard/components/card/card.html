<div class="dashboard-card" [appActiveHighlight]="hasActiveDevices">
    <div class="card-header">
        <h3>{{ card.title }}</h3>
    </div>
    <div class="card-content" [ngClass]="card.layout">
        @for (item of card.items; track item.label) {
        @if (isDevice(item)) {
        <app-device [device]="item"></app-device>
        } @else {
        <app-sensor [sensor]="item"></app-sensor>
        }
        }
    </div>
</div>
